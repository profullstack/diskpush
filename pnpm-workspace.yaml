packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  # esbuild ships prebuilt binaries; its postinstall just selects one.
  esbuild: true
  # electron's postinstall downloads the prebuilt binary for this platform.
  electron: true
  # The MediaAnalyzer plugin's ffmpeg: its postinstall downloads the static
  # binary for this platform, so video of any size is sampled locally with
  # nothing for the user to install.
  ffmpeg-static: true
  # ssh2's native crypto binding and cpu-features are optional speedups.
  # Declined so that installing DiskPush never needs a C++ toolchain; ssh2
  # falls back to its pure-JS implementation.
  ssh2: false
  cpu-features: false

minimumReleaseAgeExclude:
  - '@profullstack/x402-gateway@0.1.0 || 0.7.0'
  - '@profullstack/hqtui@0.2.0 || 0.5.0 || 0.5.1'
  - '@profullstack/keys'
